zerops:
  - setup: ppa
    build:
      base: ubuntu/go@latest
      buildCommands:
        - go build -o bin/ppa-server
      deployFiles:
        - bin/ppa-server
      cache: true
    run:
      base: ubuntu@26.04
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        LISTEN_ADDR: :8080
        LOG_LEVEL: INFO

        S3_ENDPOINT: ${ppastorage_apiUrl}
        S3_BUCKET: ${ppastorage_bucketName}
        S3_ACCESS_KEY: ${ppastorage_accessKeyId}
        S3_SECRET_KEY: ${ppastorage_secretAccessKey}

        DISCORD_POLL_INTERVAL: 5m
        POSTMAN_POLL_INTERVAL: 5m
        ZCLI_POLL_INTERVAL: 5m

        MAINTAINER: Matěj Pavlíček <tikinang@gmail.com>
      start: ./bin/ppa-server
